<!-- Supabase Auth email template: confirm a new email address with a 6-digit code. -->
<!-- TODO(owner): final copy and branding once the React Email design is ready. -->
<div style="font-family: Arial, sans-serif; color: #2b211b; max-width: 480px; margin: 0 auto; padding: 24px;">
  <h1 style="font-size: 20px; margin: 0 0 16px;">Confirm your email</h1>
  <p style="margin: 0 0 16px;">Enter this code to add {{ .NewEmail }} to your Wafaz account. It expires in 10 minutes.</p>
  <p style="font-size: 32px; font-weight: bold; letter-spacing: 8px; margin: 0 0 24px;">{{ .Token }}</p>
  <p style="font-size: 13px; color: #6b5d52; margin: 0;">If you didn't ask for this code, you can ignore this email.</p>
</div>
